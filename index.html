<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vsevolod Shop</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>

<header class="topbar">
  <img class="logo" src="assets/logo.png" alt="Vsevolod Shop" draggable="false">
</header>

<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar" aria-label="Разделы">
  <span class="lens" id="lens"></span>
  <button class="tab" data-tab="catalog" aria-label="Каталог">
    <svg viewBox="0 0 24 24"><path d="M3 9.5 4.6 4.8A2 2 0 0 1 6.5 3.5h11a2 2 0 0 1 1.9 1.3L21 9.5"/><path d="M3 9.5h18v1a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M4.5 13v6a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-6"/></svg>
    <span>Каталог</span>
  </button>
  <button class="tab" data-tab="cart" aria-label="Корзина">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2.5 3h2.6l2.4 12.2a1.6 1.6 0 0 0 1.6 1.3h8.8a1.6 1.6 0 0 0 1.6-1.2L21.5 7.5H6"/></svg>
    <span>Корзина</span><b class="badge" id="cartBadge" hidden>0</b>
  </button>
  <button class="tab" data-tab="chat" aria-label="Чат">
    <svg viewBox="0 0 24 24"><path d="M20.5 11.5a8 8 0 0 1-11.7 7.1L3.5 20l1.4-4.8A8 8 0 1 1 20.5 11.5z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01" stroke-width="2.4"/></svg>
    <span>Чат</span>
  </button>
  <button class="tab" data-tab="profile" aria-label="Профиль">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c1.4-3.6 4.4-5.5 8-5.5s6.6 1.9 8 5.5"/></svg>
    <span>Профиль</span>
  </button>
</nav>

<div id="sheets"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
